<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Delivery - Student Delivery Service</title>
    
    <!-- Google Analytics (Retained intact) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID');
    </script>

    <!-- Tailwind CSS CDN for existing layout & styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Existing UI CSS retained */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Offline Banner (Retained) -->
    <div id="offline-banner" class="hidden bg-red-600 text-white text-center py-2 px-4 font-semibold text-sm">
        <i class="fas me-2 fa-wifi-slash"></i> You are currently offline. Live tracking and status updates may be delayed.
    </div>

    <!-- Main Navigation Header (Retained) -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-shipping-fast"></i> Campus Delivery
            </h1>
            <div id="driver-availability-badge" class="bg-green-500 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1">
                <span class="w-2 h-2 bg-white rounded-full animate-ping"></span> Amigos Online
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Live GPS Map Container (Retained) -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-bold mb-2 text-gray-700 flex items-center gap-2">
                <i class="fas fa-map-marker-alt text-indigo-600"></i> Live GPS Tracking
            </h2>
            <div id="gps-map-container" class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500">
                <span>[ Live Map Module Active ]</span>
            </div>
        </section>

        <!-- Quick Action Trigger -->
        <div class="mb-8 flex justify-center">
            <button onclick="openDeliveryModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> Request Delivery
            </button>
        </div>

        <!-- Available Amigos List Section -->
        <section class="mb-8">
            <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
                <i class="fas fa-users text-indigo-600"></i> Active Amigos
            </h2>
            <div id="amigos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Sample Amigo Card (Updated with Phone Number & Call Button) -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-bold text-gray-800 text-base">Amigo Alex</h3>
                            <span class="text-xs bg-green-100 text-green-700 font-semibold px-2 py-0.5 rounded-full">Available</span>
                        </div>
                        <!-- Driver Phone Number -->
                        <p class="text-xs text-gray-500 mb-3 flex items-center gap-1">
                            <i class="fas fa-phone text-indigo-500"></i> 📞 +91 9876543210
                        </p>
                    </div>

                    <!-- Card Actions -->
                    <div class="flex flex-col gap-2 mt-2">
                        <!-- Existing WhatsApp Button -->
                        <button onclick="openDeliveryModal()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all">
                            <i class="fab fa-whatsapp text-sm"></i> WhatsApp Request
                        </button>
                        <!-- Added Call Button -->
                        <a href="tel:+919876543210" class="w-full bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all">
                            <i class="fas fa-phone-alt text-green-600"></i> 📞 Call Amigo
                        </a>
                    </div>
                </div>

            </div>
        </section>

        <!-- Request Delivery Modal -->
        <div id="delivery-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                <button onclick="closeDeliveryModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                
                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-box text-indigo-600"></i> Request Delivery
                </h3>

                <form id="delivery-form" onsubmit="handleDeliverySubmit(event)" class="space-y-4">
                    
                    <!-- 1. Your Name -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Your Name</label>
                        <input type="text" id="cust-name" required placeholder="e.g. Rahul" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <!-- 2. Delivery Platform -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Delivery Platform</label>
                        <input type="text" id="delivery-platform" required placeholder="e.g. Zomato, Amazon, Swiggy" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <!-- 3. NEW FIELD: Item Description (Placed directly below Delivery Platform) -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Item Description</label>
                        <input type="text" id="item-description" required placeholder="3 Domino's pizzas, Amazon parcel, Laptop charger..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <!-- 4. Hostel / Destination -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Hostel / Destination</label>
                        <input type="text" id="drop-location" required placeholder="e.g. Hall 4 Room 203" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <!-- Form Action Buttons -->
                    <div class="pt-2 flex gap-3">
                        <button type="button" onclick="closeDeliveryModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm">Cancel</button>
                        <button type="submit" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2">
                            <i class="fab fa-whatsapp text-lg"></i> Send Request
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Application JavaScript Logic -->
    <script>
        // Target Admin / Dispatch WhatsApp Phone Number
        const ADMIN_WHATSAPP_NUMBER = "910000000000";

        // Firebase & Firestore architecture logic remains active here...
        // [Existing Firestore listeners, GPS Map rendering, & availability functions preserved]

        // Modal Controls
        function openDeliveryModal() {
            document.getElementById('delivery-modal').classList.remove('hidden');
        }

        function closeDeliveryModal() {
            document.getElementById('delivery-modal').classList.add('hidden');
        }

        // Form Submission & WhatsApp Message Generator
        function handleDeliverySubmit(e) {
            e.preventDefault();

            // Extract input values
            const name = document.getElementById('cust-name').value.trim();
            const platform = document.getElementById('delivery-platform').value.trim();
            const itemDesc = document.getElementById('item-description').value.trim();
            const destination = document.getElementById('drop-location').value.trim();

            // Format WhatsApp Message matching required output
            let message = `Campus Delivery Request\n\n`;
            message += `Customer:\n${name}\n\n`;
            message += `Platform:\n${platform}\n\n`;
            message += `Item Description:\n${itemDesc}\n\n`;
            message += `Destination:\n${destination}`;

            // Redirect to WhatsApp
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
            closeDeliveryModal();
            document.getElementById('delivery-form').reset();
        }

        // Network Connectivity Handlers
        window.addEventListener('online', () => document.getElementById('offline-banner').classList.add('hidden'));
        window.addEventListener('offline', () => document.getElementById('offline-banner').classList.remove('hidden'));
    </script>
</body>
</html>
